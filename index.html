<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium 3D Cyber Clicker</title>
    <!-- Tailwind для стилизации интерфейса -->
    <script src="https://jsdelivr.net"></script>
    <!-- Three.js для полноценного 3D -->
    <script src="https://cloudflare.com"></script>
    <!-- Библиотека анимаций GSAP для плавного отскока шторки и нажатия кнопки -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0f19; user-select: none; -webkit-user-select: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        #blur-overlay { transition: backdrop-filter 0.5s ease, background-color 0.5s ease; }
        #blur-overlay.active { backdrop-filter: blur(8px); background-color: rgba(0,0,0,0.5); }
    </style>
</head>
<body class="text-white font-sans">

    <!-- 3D Сцена -->
    <div id="canvas-container"></div>

    <!-- Задний фон для размытия при открытии магазина -->
    <div id="blur-overlay" class="absolute inset-0 z-5 pointer-events-none"></div>

    <!-- Интерфейс -->
    <div class="ui-layer min-h-screen flex flex-col justify-between p-6">
        <!-- Верхняя панель: Баланс -->
        <div class="text-center mt-8">
            <p class="text-sm uppercase tracking-widest text-slate-400 font-semibold">Баланс</p>
            <h1 id="balance-display" class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-amber-400 drop-shadow-[0_0_15px_rgba(239,68,68,0.5)]">0 $</h1>
            <p id="cpc-display" class="text-xs text-slate-500 mt-1">Доход за тап: +1$</p>
        </div>

        <!-- Нижняя панель: Кнопка магазина -->
        <div class="flex justify-center mb-6">
            <button onclick="toggleShop(true)" class="interactive bg-slate-900/80 border border-slate-700/50 hover:border-red-500/50 px-8 py-4 rounded-2xl shadow-xl transition-all duration-300 transform hover:scale-105 active:scale-95 text-lg font-bold tracking-wide flex items-center gap-2 backdrop-blur-md">
                🛒 Магазин улучшений
            </button>
        </div>
    </div>

    <!-- Шторка магазина (падающая сверху) -->
    <div id="shop-curtain" class="interactive absolute left-0 right-0 top-0 bg-slate-900/95 border-b border-red-500/30 rounded-b-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.8)] z-50 p-6 flex flex-col max-h-[85vh] backdrop-blur-xl translate-y-[-105%]">
        <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <h2 class="text-2xl font-black tracking-wide text-red-500">КИБЕР-МАРКЕТ</h2>
            <button onclick="toggleShop(false)" class="text-slate-400 hover:text-white text-2xl p-2">✕</button>
        </div>

        <!-- Список товаров -->
        <div class="space-y-4 overflow-y-auto flex-1 pr-1">
            <!-- Товар 1 -->
            <div class="bg-slate-800/50 border border-slate-700/40 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-lg">🔋 Мульти-Тап х20000</h3>
                    <p class="text-xs text-slate-400">Увеличивает силу клика на +20,000$ навсегда</p>
                </div>
                <button onclick="buyUpgrade('multitap')" id="btn-multitap" class="bg-red-600 hover:bg-red-500 disabled:bg-slate-800 disabled:text-slate-600 font-bold px-4 py-2 rounded-xl text-sm transition shadow-lg shadow-red-900/40">1,000,000 $</button>
            </div>

            <!-- Товар 2 -->
            <div class="bg-slate-800/50 border border-slate-700/40 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-lg">🧪 Зелье Дикого Тапа</h3>
                    <p class="text-xs text-slate-400">Авто-клик: 1100 тапов за 30 секунд</p>
                    <p id="potion-timer" class="text-xs text-amber-400 hidden font-semibold mt-1">Активно: 30с</p>
                </div>
                <button onclick="buyUpgrade('potion')" id="btn-potion" class="bg-amber-600 hover:bg-amber-500 disabled:bg-slate-800 disabled:text-slate-600 font-bold px-4 py-2 rounded-xl text-sm transition shadow-lg shadow-amber-900/40">1,500 $</button>
            </div>

            <!-- Товар 3 -->
            <div class="bg-slate-800/50 border border-slate-700/40 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-lg">🤖 Кибер-Майнер</h3>
                    <p class="text-xs text-slate-400">Приносит +500$ каждую секунду на автомате</p>
                </div>
                <button onclick="buyUpgrade('miner')" id="btn-miner" class="bg-cyan-600 hover:bg-cyan-500 disabled:bg-slate-800 disabled:text-slate-600 font-bold px-4 py-2 rounded-xl text-sm transition shadow-lg shadow-cyan-900/40">10,000 $</button>
            </div>
        </div>
    </div>
    <script>
        // ИГРОВАЯ ЛОГИКА И СОСТОЯНИЕ
        let gameState = {
            balance: 0,
            cpc: 1,
            passiveIncome: 0,
            isPotionActive: false
        };

        // Локальное сохранение данных (чтобы баланс не сбрасывался!)
        function loadGame() {
            const saved = localStorage.getItem('cyber_clicker_save');
            if (saved) {
                gameState = JSON.parse(saved);
                gameState.isPotionActive = false; // Сбрасываем зелье при перезагрузке
            }
        }
        function saveGame() {
            localStorage.setItem('cyber_clicker_save', JSON.stringify(gameState));
        }

        function updateUI() {
            document.getElementById('balance-display').innerText = Math.floor(gameState.balance).toLocaleString() + ' $';
            document.getElementById('cpc-display').innerText = `Доход за тап: +${gameState.cpc.toLocaleString()}$ | Пассив: +${gameState.passiveIncome.toLocaleString()}$/с`;
            
            document.getElementById('btn-multitap').disabled = gameState.balance < 1000000;
            document.getElementById('btn-potion').disabled = gameState.balance < 1500 || gameState.isPotionActive;
            document.getElementById('btn-miner').disabled = gameState.balance < 10000;
        }

        function buyUpgrade(type) {
            if (type === 'multitap' && gameState.balance >= 1000000) {
                gameState.balance -= 1000000;
                gameState.cpc += 20000;
            } else if (type === 'potion' && gameState.balance >= 1500 && !gameState.isPotionActive) {
                gameState.balance -= 1500;
                startPotionEffect();
            } else if (type === 'miner' && gameState.balance >= 10000) {
                gameState.balance -= 10000;
                gameState.passiveIncome += 500;
            }
            saveGame();
            updateUI();
        }

        function startPotionEffect() {
            gameState.isPotionActive = true;
            const timerEl = document.getElementById('potion-timer');
            timerEl.classList.remove('hidden');
            
            let duration = 30;
            let tapsPerSecond = 1100 / 30;

            const potionInterval = setInterval(() => {
                gameState.balance += tapsPerSecond * gameState.cpc;
                updateUI();
                if (window.button3D) {
                    gsap.to(window.button3D.scale, {x: 1.03, y: 0.97, z: 1.03, duration: 0.1, yoyo: true, repeat: 1});
                }
            }, 1000);

            const countdown = setInterval(() => {
                duration--;
                timerEl.innerText = `Активно: ${duration}с`;
                if (duration <= 0) {
                    clearInterval(countdown);
                    clearInterval(potionInterval);
                    gameState.isPotionActive = false;
                    timerEl.classList.add('hidden');
                    saveGame();
                    updateUI();
                }
            }, 1000);
        }

        // Пассивный доход каждую секунду
        setInterval(() => {
            if (gameState.passiveIncome > 0) {
                gameState.balance += gameState.passiveIncome;
                saveGame();
                updateUI();
            }
        }, 1000);

        // ФИЗИКА ШТОРКИ (Эффект упругого удара об низ через GSAP Bounce)
        let isShopOpen = false;
        function toggleShop(open) {
            isShopOpen = open;
            const shop = document.getElementById('shop-curtain');
            const overlay = document.getElementById('blur-overlay');
            
            if (open) {
                overlay.classList.add('active');
                gsap.to(shop, { translateY: "0%", duration: 0.8, ease: "bounce.out" });
            } else {
                overlay.classList.remove('active');
                gsap.to(shop, { translateY: "-105%", duration: 0.4, ease: "power2.in" });
            }
        }
      // --- НАСТРОЙКА 3D ГРАФИКИ (THREE.JS) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070a13); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 7);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // СТУДИЙНОЕ КИБЕРПАНК ОСВЕЩЕНИЕ
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff3333, 1.8);
        dirLight.position.set(5, 8, 5);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x3366ff, 0.6);
        fillLight.position.set(-5, 4, -2);
        scene.add(fillLight);

        // СОЗДАНИЕ ДЕТАЛИЗИРОВАННОЙ 3D КНОПКИ
        const buttonGroup = new THREE.Group();

        // 1. Тяжелый металлический корпус
        const baseGeo = new THREE.CylinderGeometry(1.6, 1.8, 0.5, 64);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.2 });
        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
        baseMesh.position.y = 0.25;
        buttonGroup.add(baseMesh);

        // 2. Глянцевая красная кнопка
        const buttonGeo = new THREE.CylinderGeometry(1.3, 1.4, 0.4, 64);
        const buttonMat = new THREE.MeshStandardMaterial({
            color: 0xcc0000, metalness: 0.4, roughness: 0.15, clearcoat: 1.0, clearcoatRoughness: 0.1
        });
        window.button3D = new THREE.Mesh(buttonGeo, buttonMat);
        window.button3D.position.y = 0.6; 
        buttonGroup.add(window.button3D);

        scene.add(buttonGroup);

        // ФИЗИКА НАЖАТИЯ (РЕЙКАСТИНГ)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleTap(event) {
            if (isShopOpen) return;

            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(window.button3D);

            if (intersects.length > 0) {
                gameState.balance += gameState.cpc;
                saveGame();
                updateUI();

                // Анимация прогибания вниз и упругого отскока вверх
                gsap.killTweensOf(window.button3D.position);
                gsap.killTweensOf(window.button3D.scale);
                
                gsap.to(window.button3D.position, { y: 0.42, duration: 0.05, ease: "power1.out", onComplete: () => {
                    gsap.to(window.button3D.position, { y: 0.6, duration: 0.25, ease: "elastic.out(1, 0.4)" });
                }});
                
                gsap.to(window.button3D.scale, { x: 1.05, z: 1.05, y: 0.85, duration: 0.05, onComplete: () => {
                    gsap.to(window.button3D.scale, { x: 1, z: 1, y: 1, duration: 0.25, ease: "elastic.out(1, 0.4)" });
                }});
            }
        }

        window.addEventListener('mousedown', handleTap);
        window.addEventListener('touchstart', handleTap, { passive: true });

        // РЕНДЕР И ПЛАВНОЕ ВРАЩЕНИЕ
        function animate() {
            requestAnimationFrame(animate);
            buttonGroup.rotation.y += 0.003; // Крутой автоповорот платформы
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Запуск
        loadGame();
        updateUI();
        animate();
    </script>
</body>
</html>
